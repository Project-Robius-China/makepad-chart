[package]
name = "bi_dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
makepad-widgets = { git = "https://github.com/Project-Robius-China/makepad", branch = "makepad_component_used_makepad_version" }
makepad-charts = { path = "../.." }
makepad-components = { git = "https://github.com/alanpoon/makepad-component", branch = "color_picker", features = ["ColorPicker"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
